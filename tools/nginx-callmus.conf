# =============================================================================
# nginx para callmus.com — Roadmap #16 (endurecimiento)
# =============================================================================
# ESTE ARCHIVO ES UNA REFERENCIA, no se instala solo. En la e2-micro vive en
# /etc/nginx/sites-available/callmus (o donde ya esté el que funciona).
#
# -----------------------------------------------------------------------------
# SI SOLO SE CAMBIA UNA COSA, QUE SEAN ESTAS DOS LÍNEAS
# -----------------------------------------------------------------------------
# Dentro del `location /` que ya hace de proxy, tienen que estar:
#
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
# La primera hace que el servidor vea la IP del visitante en vez de 127.0.0.1
# (sin ella, el límite de intentos de /auth/* no puede separar a un atacante del
# resto y pasa a contar por usuario/correo). La segunda le dice que la petición
# venía por TLS, y con eso la cookie de sesión se marca `Secure` y se manda HSTS.
#
# Para ver si ya están:      sudo nginx -T | grep -i x-forwarded
# Tras cambiar algo:         sudo nginx -t && sudo systemctl reload nginx
#
# El servidor avisa por su cuenta: en la primera petición tras arrancar imprime
# una línea `🔐 Seguridad: …` y, si falta alguna de las dos cabeceras, el aviso
# correspondiente. Se ve con `journalctl -u callmus -n 50` (o donde vaya el log).
# =============================================================================


# --- Límite de peticiones a nivel de proxy (defensa en profundidad) ----------
# El servidor ya limita /auth/* por su cuenta; esto para el tráfico ANTES de
# llegar a Python, que en una máquina de 1 GB con un solo hilo de eventlet es
# justo donde interesa pararlo. Va en el contexto http {}, es decir en
# /etc/nginx/nginx.conf, NO dentro de server {}.
#
#     limit_req_zone $binary_remote_addr zone=callmus_auth:10m rate=20r/m;
#     limit_req_zone $binary_remote_addr zone=callmus_gen:10m  rate=10r/s;


server {
    listen 80;
    listen [::]:80;
    server_name callmus.com www.callmus.com;
    # Todo a HTTPS. Único hueco: el reto de certbot, que va por HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name callmus.com www.callmus.com;

    # --- Certificado (certbot lo gestiona; estas rutas son las suyas) --------
    ssl_certificate     /etc/letsencrypt/live/callmus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/callmus.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Subida de barajas (Roadmap #5) -------------------------------------
    # decks.py acepta zips de hasta 24 MB; el techo por defecto de nginx es 1 MB
    # y devolvería un 413 antes de que Python llegara a verlo.
    client_max_body_size 32m;

    # Las cabeceras de seguridad las pone la aplicación (seguridad.py), incluida
    # la CSP con nonce, que no se puede escribir aquí porque cambia en cada
    # petición. Lo único que tiene sentido duplicar aquí es HSTS, para que la
    # manden también las respuestas que no pasan por Flask (errores de nginx):
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # --- La aplicación -------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # ---- LAS DOS IMPRESCINDIBLES (ver la cabecera del archivo) ----------
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ---------------------------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # WebSocket: sin estas dos, Socket.IO se queda en "polling" eterno y la
        # mesa va a tirones (y la e2-micro se come una petición HTTP por segundo
        # y jugador en vez de una conexión abierta).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Una partida puede pasar minutos sin tráfico (alguien pensando, una
        # pausa por desconexión): con el minuto por defecto nginx cortaría el
        # socket. 7 días es lo que recomienda la propia documentación de
        # Socket.IO para el túnel; el ping/pong de la aplicación (25 s) es quien
        # detecta de verdad a los caídos.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering off;      # el estado de la mesa tiene que salir ya

        # limit_req zone=callmus_gen burst=40 nodelay;
    }

    # Los mismos límites, más estrechos, en el login (si se activan las zonas).
    # location ~ ^/auth/(login|registro|reset|solicitar_) {
    #     limit_req zone=callmus_auth burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:5001;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Host              $host;
    # }
}


# =============================================================================
# CLOUDFLARE — lo que queda por hacer a mano (Roadmap #16.3)
# =============================================================================
# Nada de esto es necesario para que el juego funcione: el servidor ya está
# endurecido sin ello. Lo que aporta Cloudflare es (a) absorber un ataque antes
# de que llegue a una máquina de 1 GB, (b) el país del visitante para la
# analítica, que hoy sale "desconocido", y (c) caché de las imágenes de las
# cartas, que es casi todo el tráfico de subida de la máquina.
#
# 1. DNS: mover los registros de callmus.com a Cloudflare y poner la nube en
#    NARANJA (proxied). Los WebSockets funcionan en todos los planes, gratis
#    incluido.
#
# 2. SSL/TLS → modo "Full (strict)". Con el certificado de Let's Encrypt que ya
#    hay, funciona tal cual. NO usar "Flexible": deja el tramo Cloudflare→origen
#    en claro y además rompe la detección de HTTPS del servidor.
#
# 3. Security → WAF → Rate limiting rules:
#       expresión:  (http.request.uri.path contains "/auth/")
#       acción:     Block, 10 peticiones por minuto y por IP.
#    Es el mismo límite que aplica seguridad.py, pero un salto antes.
#
# 4. Security → Bots → "Bot Fight Mode" activado.
#
# 5. Rules → Cache rules: cachear /static/img/* (las cartas ya salen con
#    Cache-Control immutable de un año desde Flask, así que Cloudflare lo
#    respeta sin más configuración).
#
# 6. Recuperar la IP real detrás de Cloudflare. Dos opciones, cualquiera vale:
#
#    a) El módulo real_ip de nginx (recomendado, es una vez y se olvida):
#         real_ip_header CF-Connecting-IP;
#         include /etc/nginx/cloudflare-ips.conf;   # set_real_ip_from … por rango
#       Los rangos están en https://www.cloudflare.com/ips/ y se refrescan con
#       un cron mensual que reescriba ese include.
#
#    b) No tocar nada: seguridad.ip_cliente() ya prefiere la cabecera
#       CF-Connecting-IP cuando existe. Es suficiente para los límites y para la
#       analítica; lo que no arregla es lo que registre el propio nginx en su
#       access.log, que seguiría viendo la IP de Cloudflare.
#
# 7. Cuando esté puesto, comprobar en https://securityheaders.com/?q=callmus.com
#    (debería salir A o A+) y jugar una partida entera para confirmar que el
#    WebSocket aguanta el salto.
# =============================================================================
